      <div class="tournament-insert">

        <BR>
        <h3>{{time_control}}</h3>
        <BR>
        <iframe class="tournament-info-doc"

        ></iframe>
        <button
          id="joinTournamentBtn" class="tournaments-btn" onclick="joinTournamentView({{number}})"
          >Enter this tournament</button>
        <button
          id="showTournamentBtn" class="tournaments-btn" onclick="showTournamentLst()"
          >Return to tournament list</button>
      </div>
  </script><!-- the template for joining tournaments -->

  <script id="join-tournament-template" type=
  "text/x-tmpl-mustache">
      <div id="join-tournament-insert">
        <h1 id="join-tournament" class="title">Join Tournament</h1>
        <h3>Tournament: {{title}}</h3>

        <form action="https://formsubmit.co/skhorizonchessclub@gmail.com" method="POST" id="tournament-signup">
          <input type="hidden" name="_subject" value="{{title}}">
          <div class="field">
            <label class="field-lbl" for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required/>
            <small></small>
          </div>
          <div class="field">
            <label class="field-lbl" for="email">Email:</label>
            <input type="text" id="email" name="email" placeholder="Enter your email address" required/>
            <small></small>
          </div>

          <div class="field">
            <label class="field-lbl" for="phone">Phone:</label>
            <input type="text" id="phone" name="phone" placeholder="Enter your phone number" required/>
            <small></small>
          </div>
          <div class="field">
            <label class="field-lbl" for="cfc-id">Enter CFC id:</label>
            <input type="text" id="cfc-id" name="cfc-id" placeholder="Canadian Chess Federation ID - Leave blank if you plan to get before tournament."/>
            <BR>
            <small>(You do not need a CFC ID to register, BUT you must have one by the end of the tournament.)</small>
          </div>

          <label class="field-lbl" for="tournament-bye-req">Bye request:</label>
          <div id="tournament-bye-req" class="field">
            <input type="radio" id="open" value="open" name="bye-req"/>
            <label for="rnd1">round 1 - Friday 7PM</label>
            <input type="radio" id="rnd1" value="round 1" name="bye-req"/>
            <label for="rnd2">round 2 - Saturday 10AM</label>
            <input type="radio" id="rnd2" value="round 2" name="bye-req"/>
            <label for="rnd3">round 3 - Saturday 2PM</label>
            <input type="radio" id="rnd3" value="round 3" name="bye-req"/>
            <label for="rnd4">round 4 - Sunday 10AM</label>
            <input type="radio" id="rnd4" value="round 4" name="bye-req"/>
            <label for="rnd5">round 5 - Sunday 2PM</label>
            <input type="radio" id="rnd5" value="round 5" name="bye-req"/>
          </div>

          <iframe  class="tournament-info-doc" src="https://docs.google.com/document/d/e/2PACX-1vSarVAe_XP91YMZnk8vgbuJBEZY1rJeNtyaofAASGqONqa-laP3vFlMLtEoo6rVwb65_qRkAT0s95vN/pub?embedded=true"></iframe>
          <div class="field">
            <label class="field-lbl" for="read-rules">I have read and accepted the rules:</label>
            <input type="checkbox" required/>
            <small></small>
          </div>
          <input type="submit" value="Enter Tournament"></input>
          <input name="_formsubmit_id" type="text" style="display:none">
        </form>
      </div>
  </script>
