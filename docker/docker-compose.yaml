name: shcc-website

services:
  web:
    build:
      context: .
      dockerfile: PHP.Dockerfile

    ports:
      - "80:80"

    volumes:
      - ../:/var/www/html

      - ./srv:/srv/

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: library
      MYSQL_USER: user
      MYSQL_PASSWORD: password
